# Updates the Supabase backend whenever main changes something under supabase/:
# applies new database migrations, deploys the manage-staff function, and
# copies SETUP_KEY into the function's secrets. Can also be run by hand from
# Actions → "Deploy backend" → Run workflow.
# Needs repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens → Generate
#   SUPABASE_DB_PASSWORD   the database password chosen when creating the project
#   SETUP_KEY              already added for the "Add hospital" job
# and the SUPABASE_URL variable used by the web deploy.
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SETUP_KEY: ${{ secrets.SETUP_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check settings
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SETUP_KEY SUPABASE_URL; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (see the top of deploy-backend.yml)"; exit 1; fi
          done
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          echo "PROJECT_REF=$ref" >> "$GITHUB_ENV"
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy manage-staff function
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" SETUP_KEY="$SETUP_KEY"
          supabase functions deploy manage-staff --project-ref "$PROJECT_REF" --use-api
      - name: Report
        run: echo "::notice::Backend is up to date (database tables and manage-staff function)."
